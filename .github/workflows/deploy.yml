name: Deploy ETM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-admin-web:
    name: Deploy Admin Web to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/admin_web

      - name: Build web
        run: flutter build web --release
        working-directory: apps/admin_web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: etm-transport-823e6

  trigger-render-deploy:
    name: Trigger Render Backend Deploy
    runs-on: ubuntu-latest
    needs: deploy-admin-web
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/services/srv-$(echo ${{ secrets.RENDER_SERVICE_ID }})/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"
